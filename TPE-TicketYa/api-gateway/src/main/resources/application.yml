server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          # El gateway quita el prefijo /api (StripPrefix=1) y reenvia los headers
          # X-User-Id, X-User-Rol e Idempotency-Key tal cual.
          # /internal/** no tiene ruta, por lo que responde 404.
          routes:
            # Rutas de ms-reservas que comparten el prefijo /api/eventos/:
            # deben declararse ANTES que la ruta general de eventos.
            - id: reservas-disponibilidad
              uri: ${MS_RESERVAS_URL:http://localhost:8082}
              order: 0
              predicates:
                - Path=/api/eventos/*/disponibilidad,/api/eventos/*/sectores/*/asientos
              filters:
                - StripPrefix=1
            - id: reservas
              uri: ${MS_RESERVAS_URL:http://localhost:8082}
              order: 1
              predicates:
                - Path=/api/reservas,/api/reservas/**
              filters:
                - StripPrefix=1
            - id: eventos
              uri: ${MS_EVENTOS_URL:http://localhost:8081}
              order: 2
              predicates:
                - Path=/api/lugares,/api/lugares/**,/api/eventos,/api/eventos/**
              filters:
                - StripPrefix=1
            - id: ventas
              uri: ${MS_VENTAS_URL:http://localhost:8083}
              order: 3
              predicates:
                - Path=/api/compras,/api/compras/**,/api/entradas,/api/entradas/**,/api/devoluciones,/api/devoluciones/**
              filters:
                - StripPrefix=1

management:
  endpoints:
    web:
      exposure:
        include: health,gateway
