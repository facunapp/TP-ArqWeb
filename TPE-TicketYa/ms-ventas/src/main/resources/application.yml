server:
  port: 8083

spring:
  application:
    name: ms-ventas
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/db_ventas}
    username: ${DB_USER:ticketya}
    password: ${DB_PASSWORD:ticketya}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    serialization:
      write-dates-as-timestamps: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

ticketya:
  devolucion:
    horas-minimas-antes-del-evento: 72
  services:
    eventos-url: ${MS_EVENTOS_URL:http://localhost:8081}
    reservas-url: ${MS_RESERVAS_URL:http://localhost:8082}
